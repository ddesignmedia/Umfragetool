<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-Umfrage &amp; Quiz</title>
    <!-- Einbindung der Bibliotheken für PDF-Export und QR-Code -->
    <script src="js/libs/jspdf.umd.min.js"></script>
    <script src="js/libs/html2canvas.min.js"></script>
    <script src="js/libs/qrcode.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        .progress-container {
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.3s ease;
        }

        .highscore-live {
            color: #10b981;
            font-weight: bold;
            font-size: 0.8em;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            background: #eee;
            font-weight: bold;
            margin-right: 5px;
        }

        .rank-1 {
            background: #ffd700;
        }

        .rank-2 {
            background: #c0c0c0;
        }

        .rank-3 {
            background: #cd7f32;
        }

        .rank-title {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 8px;
            vertical-align: middle;
        }

        .title-1 {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .title-2 {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
            border: 1px solid #a855f7;
        }

        .title-3 {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid #3b82f6;
        }
    </style>

</head>

<body>

    <div class="container">
        <h1>Danke für deine Teilnahme</h1>

        <!-- Ansicht zum Erstellen der Umfrage -->
        <div id="create-view">
            <div class="card">
                <h2>Neue Umfrage erstellen</h2>
                <input type="text" id="survey-title" placeholder="Titel der Umfrage">
                <div class="highscore-checkbox-container">
                    <input type="checkbox" id="highscore-enabled">
                    <label for="highscore-enabled">Highscoreliste aktivieren</label>
                </div>
                <div id="questions-container"></div>

                <!-- Vorlagen Sektion -->
                <div class="templates-container">
                    <span class="templates-toggle">Vorhandene Vorlage auswählen ▼</span>
                    <ul id="templates-list" class="templates-list hidden">
                        <!-- Vorlagen werden hier dynamisch eingefügt -->
                    </ul>
                </div>

                <input type="file" id="template-file-input" class="hidden" accept=".json">

                <div class="json-import-container">
                    <p>Oder fügen Sie hier direkt JSON-Inhalt ein:</p>
                    <textarea id="json-template-input" rows="5"
                        placeholder="Fügen Sie hier den JSON-Code Ihrer Umfragevorlage ein..."></textarea>
                    <button id="load-from-text-btn" class="secondary">Aus Text laden</button>
                </div>

                <div class="card-footer">
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button id="save-template-btn" class="secondary">Vorlage speichern</button>
                        <button id="load-template-btn" class="secondary">Vorlage laden</button>
                        <button id="copy-ai-prompt-btn" class="secondary" title="Kopiert eine Prompt-Anweisung für die KI zur Erstellung passender Test-Vorlagen in die Zwischenablage">🤖 KI-Prompt kopieren</button>
                    </div>
                    <button id="create-survey-btn">Umfrage starten</button>
                </div>
            </div>

            <!-- Bereich für aktive Umfragen -->
            <div class="card active-surveys-container">
                <h2>Aktive Umfragen</h2>
                <ul id="active-surveys-list" class="active-surveys-list">
                    <!-- Aktive Umfragen werden hier dynamisch eingefügt -->
                </ul>
            </div>
        </div>

        <!-- Ansicht zum Ausfüllen der Umfrage -->
        <div id="survey-view" class="hidden">
            <div class="card">
                <h2 id="participant-survey-title"></h2>
                <form id="survey-form"></form>
                <button id="submit-survey-btn">Antworten absenden</button>
            </div>
            <div id="thank-you-message" class="card hidden" style="text-align: center;">
                <h4 id="quiz-title-feedback"></h4>
                <div id="star-rating"></div>
                <p id="quiz-score-feedback"></p>
            </div>
        </div>

        <!-- Ansicht für die Live-Ergebnisse -->
        <div id="results-view" class="hidden">
            <div class="card">
                <h2 id="results-survey-title">Live-Ergebnisse</h2>
                <div id="share-section">
                    <h3>Teilen Sie diesen Link mit Ihrem Publikum:</h3>
                    <p id="share-link"></p>
                    <div id="qrcode"></div>
                    <br>
                    <button id="copy-link-btn">Link kopieren</button>
                </div>
            </div>
            <div id="highscore-container"></div>
            <div id="results-container">
                <div class="loader">Warte auf erste Antworten...</div>
            </div>
            <div class="card results-actions">
                <button id="export-pdf-btn">PDF speichern</button>
                <button id="pause-survey-results-btn" class="secondary">Pausieren</button>
                <button id="delete-survey-btn" class="danger">Beenden & löschen</button>
            </div>
        </div>

        <!-- Ladeanzeige -->
        <div id="loading-view" class="loader">
            <h2>Lade...</h2>
        </div>
    </div>

    <script>
        // --- Globale Variablen ---
        const API_BASE_URL = 'api/'; // Basis-URL für die PHP-Skripte
        let pollInterval = null; // Variable für das Polling-Intervall
        let quizStartTime = null; // Für Highscore-Zeitmessung
        let userNickname = null; // Für Highscore-Spitzname
        let currentQuestionStep = 0; // Aktueller Schritt bei Einzelfragen
        let activeResponseId = null; // ID der laufenden Antwort-Session

        // --- UI Elemente ---
        const views = {
            create: document.getElementById('create-view'),
            survey: document.getElementById('survey-view'),
            results: document.getElementById('results-view'),
            loading: document.getElementById('loading-view')
        };
        const addQuestionBtn = document.getElementById('add-question-btn');
        const createSurveyBtn = document.getElementById('create-survey-btn');
        const submitSurveyBtn = document.getElementById('submit-survey-btn');
        const copyLinkBtn = document.getElementById('copy-link-btn');
        const exportPdfBtn = document.getElementById('export-pdf-btn');
        const deleteSurveyBtn = document.getElementById('delete-survey-btn');
        const saveTemplateBtn = document.getElementById('save-template-btn');
        const loadTemplateBtn = document.getElementById('load-template-btn');
        const copyAiPromptBtn = document.getElementById('copy-ai-prompt-btn');
        const templateFileInput = document.getElementById('template-file-input');
        const templatesToggle = document.querySelector('.templates-toggle');
        const templatesList = document.getElementById('templates-list');
        const activeSurveysList = document.getElementById('active-surveys-list');

        // --- App Initialisierung & Routing ---

        function handleRouting() {
            const hash = window.location.hash;
            hideAllViews();
            if (pollInterval) clearInterval(pollInterval); // Polling stoppen bei Ansichtswechsel

            if (hash.startsWith('#results/')) {
                const surveyId = hash.split('/')[1];
                showResultsView(surveyId);
            } else if (hash.startsWith('#survey/')) {
                const surveyId = hash.split('/')[1];
                showSurveyView(surveyId);
            } else {
                showCreateView();
            }
        }

        function hideAllViews() {
            Object.values(views).forEach(view => view.classList.add('hidden'));
        }

        window.addEventListener('hashchange', handleRouting);

        // --- Ansicht: Umfrage erstellen ---

        let questionCount = 0;

        function showCreateView() {
            views.create.classList.remove('hidden');
            if (questionCount === 0) { // Nur hinzufügen, wenn noch keine Fragen da sind
                addQuestion();
            }
            loadAndDisplayTemplates();
            loadAndDisplayActiveSurveys();
        }

        async function loadAndDisplayActiveSurveys() {
            try {
                const response = await fetch(API_BASE_URL + 'list_active_surveys.php');
                const surveys = await response.json();

                activeSurveysList.innerHTML = ''; // Liste leeren
                if (surveys.length === 0) {
                    activeSurveysList.innerHTML = '<li>Derzeit sind keine Umfragen aktiv.</li>';
                    return;
                }

                surveys.forEach(survey => {
                    const li = document.createElement('li');
                    if (survey.paused) {
                        li.classList.add('paused');
                    }
                    li.innerHTML = `
                        <span class="survey-title">${survey.title}</span>
                        <div>
                            <button type="button" data-survey-id="${survey.id}" class="clone-survey-btn secondary icon-btn">📋</button>
                            <button type="button" data-survey-id="${survey.id}" data-paused="${survey.paused}" class="pause-survey-btn secondary icon-btn">${survey.paused ? '▶️' : '⏸️'}</button>
                            <button type="button" data-survey-id="${survey.id}" class="view-results-btn success icon-btn">📊</button>
                            <button type="button" data-survey-id="${survey.id}" class="delete-active-survey-btn danger icon-btn">🗑️</button>
                        </div>
                    `;

                    li.querySelector('.delete-active-survey-btn').addEventListener('click', async (event) => {
                        const surveyId = event.currentTarget.dataset.surveyId;
                        await deleteSurvey(surveyId, true);
                        loadAndDisplayActiveSurveys();
                    });

                    li.querySelector('.view-results-btn').addEventListener('click', (event) => {
                        const surveyId = event.currentTarget.dataset.surveyId;
                        window.location.hash = `#results/${surveyId}`;
                    });

                    li.querySelector('.clone-survey-btn').addEventListener('click', (event) => {
                        const surveyId = event.currentTarget.dataset.surveyId;
                        cloneSurvey(surveyId);
                    });

                    li.querySelector('.pause-survey-btn').addEventListener('click', async (event) => {
                        const surveyId = event.currentTarget.dataset.surveyId;
                        const isPaused = event.currentTarget.dataset.paused === 'true';
                        await togglePauseSurvey(surveyId, !isPaused);
                        loadAndDisplayActiveSurveys();
                    });

                    activeSurveysList.appendChild(li);
                });
            } catch (error) {
                console.error("Fehler beim Laden der aktiven Umfragen:", error);
                activeSurveysList.innerHTML = '<li>Fehler beim Laden der Umfragen.</li>';
            }
        }

        async function loadAndDisplayTemplates() {
            try {
                const response = await fetch(API_BASE_URL + 'list_templates.php');
                const templateNames = await response.json();

                templatesList.innerHTML = ''; // Liste leeren
                if (templateNames.length === 0) {
                    templatesList.innerHTML = '<li>Keine Vorlagen gefunden.</li>';
                    return;
                }

                templateNames.forEach(name => {
                    const li = document.createElement('li');
                    li.textContent = name;
                    li.dataset.id = name;
                    li.addEventListener('click', () => loadServerTemplate(name));
                    templatesList.appendChild(li);
                });
            } catch (error) {
                console.error("Fehler beim Laden der Vorlagen:", error);
                templatesList.innerHTML = '<li>Fehler beim Laden.</li>';
            }
        }

        templatesToggle.addEventListener('click', () => {
            templatesList.classList.toggle('hidden');
            const icon = templatesList.classList.contains('hidden') ? '▼' : '▲';
            templatesToggle.textContent = `Vorhandene Vorlage auswählen ${icon}`;
        });

        function addQuestion() {
            questionCount++;
            const container = document.getElementById('questions-container');
            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';
            questionBlock.id = `question-${questionCount}`;
            questionBlock.innerHTML = `
                <h3>Frage ${questionCount}</h3>
                <input type="text" class="question-text" placeholder="Ihre Frage hier...">
                <label for="question-type-${questionCount}">Fragetyp:</label>
                <select class="question-type" id="question-type-${questionCount}">
                    <option value="mc">Multiple-Choice (eine Antwort)</option>
                    <option value="mca">Multiple-Choice (mehrere Antworten)</option>
                    <option value="star">Stern-Bewertung (1-5 Sterne)</option>
                    <option value="text">Offener Text</option>
                    <option value="slider">Schieberegler</option>
                </select>
                <div class="options-container">
                    <div class="option-input">
                        <input type="checkbox" class="correct-answer-checkbox" title="Als korrekte Antwort markieren">
                        <input type="text" class="option-text" placeholder="Antwortmöglichkeit 1">
                        <button type="button" class="remove-option-btn danger icon-btn">-</button>
                    </div>
                    <div class="option-input">
                        <input type="checkbox" class="correct-answer-checkbox" title="Als korrekte Antwort markieren">
                        <input type="text" class="option-text" placeholder="Antwortmöglichkeit 2">
                        <button type="button" class="remove-option-btn danger icon-btn">-</button>
                    </div>
                </div>
                <button type="button" class="add-option-btn secondary icon-btn">+</button>
                
                <div class="slider-config-container hidden">
                    <div class="slider-config-row">
                        <div class="input-group">
                            <label>Minimum:</label>
                            <input type="number" class="slider-min" value="0">
                        </div>
                        <div class="input-group">
                            <label>Maximum:</label>
                            <input type="number" class="slider-max" value="10">
                        </div>
                    </div>
                    <div class="slider-config-row">
                        <div class="input-group">
                            <label>Beschriftung Minimum (optional):</label>
                            <input type="text" class="slider-min-label" placeholder="z. B. ganz schlecht">
                        </div>
                        <div class="input-group">
                            <label>Beschriftung Maximum (optional):</label>
                            <input type="text" class="slider-max-label" placeholder="z. B. super">
                        </div>
                    </div>
                </div>

                <div class="question-actions">
                    <button type="button" class="add-sibling-question-btn success icon-btn">+</button>
                    <button type="button" class="remove-question-btn danger icon-btn">🗑️</button>
                </div>
            `;
            container.appendChild(questionBlock);

            questionBlock.querySelector('.add-sibling-question-btn').addEventListener('click', () => {
                addQuestion();
            });

            questionBlock.querySelector('.question-type').addEventListener('change', (e) => {
                const optionsDiv = questionBlock.querySelector('.options-container');
                const addOptionBtn = questionBlock.querySelector('.add-option-btn');
                const sliderConfig = questionBlock.querySelector('.slider-config-container');
                if (e.target.value === 'text' || e.target.value === 'star' || e.target.value === 'slider') {
                    optionsDiv.classList.add('hidden');
                    addOptionBtn.classList.add('hidden');
                } else {
                    optionsDiv.classList.remove('hidden');
                    addOptionBtn.classList.remove('hidden');
                }

                if (e.target.value === 'slider') {
                    sliderConfig.classList.remove('hidden');
                } else {
                    sliderConfig.classList.add('hidden');
                }
            });

            questionBlock.querySelector('.add-option-btn').addEventListener('click', () => {
                addOption(questionBlock);
            });

            questionBlock.querySelector('.remove-question-btn').addEventListener('click', () => {
                questionBlock.remove();
            });
        }

        function addOption(questionBlock, optionData = { text: '', correct: false }) {
            const optionsContainer = questionBlock.querySelector('.options-container');
            const optionCount = optionsContainer.children.length + 1;
            const newOption = document.createElement('div');
            newOption.className = 'option-input';

            const placeholderText = `Antwortmöglichkeit ${optionCount}`;
            const isChecked = optionData.correct ? 'checked' : '';

            newOption.innerHTML = `
                <input type="checkbox" class="correct-answer-checkbox" title="Als korrekte Antwort markieren" ${isChecked}>
                <input type="text" class="option-text" placeholder="${placeholderText}" value="${optionData.text || ''}">
                <button type="button" class="remove-option-btn danger icon-btn">-</button>
            `;
            optionsContainer.appendChild(newOption);
            newOption.querySelector('.remove-option-btn').addEventListener('click', () => {
                newOption.remove();
            });
        }

        async function cloneSurvey(surveyId) {
            try {
                // Wir verwenden denselben Endpunkt, der auch zum Ausfüllen der Umfrage für Teilnehmer dient
                const response = await fetch(`${API_BASE_URL}get_survey.php?id=${surveyId}`);
                if (!response.ok) throw new Error(`Serverfehler: ${response.statusText}`);
                const data = await response.json();

                // Wir benennen den Titel um, um klarzustellen, dass es eine Kopie ist
                data.title = `Kopie von: ${data.title}`;

                populateFormWithTemplate(data);

                // Scrollen Sie zum Anfang der Seite, um das ausgefüllte Formular zu sehen
                window.scrollTo(0, 0);
                alert("Die Umfrage wurde als neue Vorlage in das Formular geladen. Sie können sie jetzt bearbeiten und als neue Umfrage starten.");
            } catch (error) {
                alert('Fehler beim Klonen der Umfrage: ' + error.message);
                console.error(error);
            }
        }

        // --- Vorlagen-Funktionen ---

        async function loadServerTemplate(templateId) {
            try {
                const response = await fetch(`${API_BASE_URL}get_template.php?id=${templateId}`);
                if (!response.ok) throw new Error(`Serverfehler: ${response.statusText}`);
                const data = await response.json();
                populateFormWithTemplate(data);
                // Schließe die Liste nach der Auswahl
                templatesList.classList.add('hidden');
                templatesToggle.textContent = 'Vorhandene Vorlage auswählen ▼';
            } catch (error) {
                alert('Fehler beim Laden der Vorlage: ' + error.message);
                console.error(error);
            }
        }

        function getSurveyDataFromForm() {
            const title = document.getElementById('survey-title').value.trim();
            const highscoreEnabled = document.getElementById('highscore-enabled').checked;
            const questions = [];
            const questionBlocks = document.querySelectorAll('.question-block');

            for (const block of questionBlocks) {
                const text = block.querySelector('.question-text').value.trim();
                const type = block.querySelector('.question-type').value;
                if (!text) continue;

                const question = { text, type, options: [] };

                if (type === 'mc' || type === 'mca') {
                    const optionDivs = block.querySelectorAll('.option-input');
                    optionDivs.forEach(div => {
                        const optionText = div.querySelector('.option-text').value.trim();
                        const isCorrect = div.querySelector('.correct-answer-checkbox').checked;
                        if (optionText) {
                            question.options.push({ text: optionText, correct: isCorrect });
                        }
                    });
                } else if (type === 'slider') {
                    question.min = parseInt(block.querySelector('.slider-min').value) || 0;
                    question.max = parseInt(block.querySelector('.slider-max').value) || 10;
                    question.minLabel = block.querySelector('.slider-min-label').value.trim();
                    question.maxLabel = block.querySelector('.slider-max-label').value.trim();
                }
                questions.push(question);
            }
            return { title, questions, highscoreEnabled };
        }

        function saveTemplate() {
            const surveyData = getSurveyDataFromForm();
            if (!surveyData.title && surveyData.questions.length === 0) {
                alert("Es gibt nichts zu speichern. Fügen Sie bitte einen Titel oder Fragen hinzu.");
                return;
            }

            // Sicherstellen, dass die aktuelle Highscore-Einstellung im Template landet
            surveyData.highscoreEnabled = document.getElementById('highscore-enabled').checked;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(surveyData, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            const fileName = surveyData.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'umfrage_vorlage';
            downloadAnchorNode.setAttribute("download", `${fileName}.json`);
            document.body.appendChild(downloadAnchorNode); // Erforderlich für Firefox
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        saveTemplateBtn.addEventListener('click', saveTemplate);

        function copyAiPrompt() {
            const currentTitle = document.getElementById('survey-title').value.trim();
            const promptTopic = currentTitle ? `Thema: "${currentTitle}"` : `[HIER THEMA, FACH, KLASSENSTUFE ODER INHALTE EINGEBEN]`;

            const promptText = `Du bist ein didaktischer Experte für Unterricht, Leistungsüberprüfung und Umfragen.
Erstelle für mich ein vollständiges Test-, Quiz- oder Umfrage-Dokument im exakten JSON-Format für unser interaktives Web-Tool.

### FORMAT-REGELN & ROOT-STRUKTUR:
Das Ergebnis MUSS ein valides JSON-Objekt sein mit genau folgenden Feldern:
1. "title": String (Aussagekräftiger Titel des Tests bzw. der Umfrage)
2. "highscoreEnabled": Boolean
   - true (Standard für Quizze/Tests): Aktiviert Highscore-Rangliste, Einzelfragen-Modus (Frage für Frage mit Fortschrittsbalken), Zeiterfassung und Punkteauswertung mit Titeln (z.B. "Du bist Legendär!", "Du bist Episch", "Das war solide").
   - false (Für klassische Umfragen): Alle Fragen werden auf einer einzigen Seite dargestellt; reine Erfassung von Antworten ohne Punktebewertung.
3. "questions": Array von Fragen-Objekten

### VERFÜGBARE FRAGENTYPEN ("type"):

1. "mc" (Multiple Choice - genau EINE Antwort ist richtig/wählbar):
   - "text": String (Fragetext)
   - "type": "mc"
   - "options": Array von Optionen (mindestens 2). Jede Option ist ein Objekt mit "text" und "correct" (true/false).
   - Quiz-Regel: Genau die richtige Option erhält "correct": true, alle anderen "correct": false.

2. "mca" (Multiple Choice - MEHRERE Antworten sind wählbar):
   - "text": String (Fragetext)
   - "type": "mca"
   - "options": Array von Optionen (mindestens 2). Jede Option ist ein Objekt mit "text" und "correct" (true/false).
   - Quiz-Regel: Alle zutreffenden Optionen erhalten "correct": true, falsche "correct": false. Ein Punkt wird nur vergeben, wenn alle richtigen und keine falschen Antworten markiert wurden.

3. "star" (Sterne-Bewertung von 1 bis 5 Sternen):
   - "text": String (z.B. Feedback, Zufriedenheit, Selbsteinschätzung)
   - "type": "star"
   - (Kein "options"-Feld nötig).

4. "slider" (Schieberegler / Skala):
   - "text": String (Skalenfrage)
   - "type": "slider"
   - "min": Ganzzahl (Minimalwert, z. B. 0 oder 1)
   - "max": Ganzzahl (Maximalwert, z. B. 10 oder 100)
   - "minLabel": String (Beschriftung links, z. B. "Gar nicht" oder "Sehr schlecht")
   - "maxLabel": String (Beschriftung rechts, z. B. "Voll und ganz" oder "Sehr gut")

5. "text" (Offenes Freitextfeld):
   - "text": String (Fragetext für offene Begründungen, Feedback oder Fragen)
   - "type": "text"
   - (Kein "options"-Feld nötig).

### VOLLSTÄNDIGES REFERENZ-BEISPIEL-JSON:
\`\`\`json
{
  "title": "Beispiel-Test mit allen Fragetypen",
  "highscoreEnabled": true,
  "questions": [
    {
      "text": "Was ist die chemische Formel von Wasser?",
      "type": "mc",
      "options": [
        { "text": "CO2", "correct": false },
        { "text": "H2O", "correct": true },
        { "text": "NaCl", "correct": false },
        { "text": "CH4", "correct": false }
      ]
    },
    {
      "text": "Welche dieser Teilchen befinden sich im Atomkern?",
      "type": "mca",
      "options": [
        { "text": "Protonen", "correct": true },
        { "text": "Elektronen", "correct": false },
        { "text": "Neutronen", "correct": true },
        { "text": "Photonen", "correct": false }
      ]
    },
    {
      "text": "Wie sicher fühlst du dich bei diesem Thema?",
      "type": "slider",
      "min": 1,
      "max": 10,
      "minLabel": "Sehr unsicher",
      "maxLabel": "Vollprofi"

        async function nextStep(survey) {
            const stepContainer = document.getElementById('survey-step-container');
            const inputs = stepContainer.querySelectorAll('input, textarea');

            // Validierung
            let answered = false;
            const q = survey.questions[currentQuestionStep];
            if (q.type === 'mca') {
                answered = Array.from(inputs).some(i => i.checked);
            } else if (q.type === 'star') {
                answered = Array.from(inputs).some(i => i.checked);
            } else if (q.type === 'mc') {
                answered = Array.from(inputs).some(i => i.checked);
            } else if (q.type === 'slider') {
                answered = true; // Slider has always a value
            } else {
                answered = inputs[0].value.trim() !== '';
            }

            if (!answered) {
                alert("Bitte beantworte zuerst die Frage.");
                return;
            }

            // Aktuelle Antwort sammeln
            const answers = {};
            if (q.type === 'mca') {
                answers[q.id] = Array.from(inputs).filter(i => i.checked).map(i => i.value);
            } else if (q.type === 'mc' || q.type === 'star') {
                const checked = Array.from(inputs).find(i => i.checked);
                answers[q.id] = checked ? checked.value : null;
            } else if (q.type === 'slider') {
                const sliderInput = Array.from(inputs).find(i => i.type === 'range');
                answers[q.id] = sliderInput ? sliderInput.value : null;
            } else {
                answers[q.id] = inputs[0].value;
            }

            const submitBtn = document.getElementById('submit-survey-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Übermittelt...';

            try {
                // Zeit berechnen
                let timeTaken = 0;
                if (quizStartTime) {
                    timeTaken = Math.round((new Date() - quizStartTime) / 1000);
                }

                // Daten senden
                const submissionData = {
                    surveyId: survey.id,
                    answers: answers,
                    responseId: activeResponseId,
                    nickname: userNickname,
                    timeTaken: timeTaken,
                    currentQuestionIndex: currentQuestionStep + 1
                };

                const response = await fetch(API_BASE_URL + 'submit_answer.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submissionData)
                });
                const result = await response.json();

                if (!result.success) throw new Error(result.message);

                activeResponseId = result.responseId; // ID merken für nächsten Schritt

                if (currentQuestionStep + 1 < survey.questions.length) {
                    showStep(survey, currentQuestionStep + 1);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Weiter';
                } else {
                    // Ende erreicht
                    handleSubmissionSuccess(survey.id, result);
                }

            } catch (error) {
                alert("Fehler beim Übermitteln: " + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Weiter';
            }
        }

            }

            try {
                const response = await fetch(API_BASE_URL + 'delete_survey.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ surveyId: surveyId, token: token })
                });

                const result = await response.json();

                if (result.success) {
                    if (!_isSilent) {
                        alert("Umfrage erfolgreich gelöscht.");
                        if (pollInterval) clearInterval(pollInterval);
                        window.location.hash = ''; // Zurück zur Startseite
                    }
                } else {
                    throw new Error(result.message || 'Unbekannter Fehler beim Löschen.');
                }
            } catch (error) {
                alert("Fehler: " + error.message);
                console.error("Fehler beim Löschen der Umfrage:", error);
            }
        }

        async function togglePauseSurvey(surveyId, pauseStatus) {
            const token = getAdminToken("Bitte geben Sie den geheimen Pause-Token ein:");
            if (!token) {
                alert("Vorgang abgebrochen. Kein Token eingegeben.");
                return;
            }

            try {
                const response = await fetch(API_BASE_URL + 'pause_survey.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ surveyId, paused: pauseStatus, token })
                });

                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.message || 'Unbekannter Fehler');
                }
            } catch (error) {
                alert('Fehler beim Ändern des Umfragestatus: ' + error.message);
                console.error(error);
            }
        }

        async function showResultsView(surveyId) {
            views.loading.classList.remove('hidden');

            const link = `${window.location.origin}${window.location.pathname}#survey/${surveyId}`;
            document.getElementById('share-link').innerText = link;

            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = '';
            new QRCode(qrcodeContainer, { text: link, width: 256, height: 256 });

            copyLinkBtn.onclick = () => {
                navigator.clipboard.writeText(link).then(() => {
                    copyLinkBtn.innerText = "Kopiert!";
                    setTimeout(() => { copyLinkBtn.innerText = "Link kopieren"; }, 2000);
                });
            };

            const fetchAndRenderResults = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}get_results.php?id=${surveyId}`);
                    const data = await response.json();

                    if (data.error) throw new Error(data.error);

                    if (document.getElementById('results-survey-title').innerText === 'Live-Ergebnisse' || data.survey.paused) {
                        document.getElementById('results-survey-title').innerHTML = `Live-Ergebnisse: ${data.survey.title}`;
                        exportPdfBtn.onclick = () => exportResultsAsPDF(data.survey.title);
                        deleteSurveyBtn.onclick = () => deleteSurvey(surveyId);
                        const pauseBtn = document.getElementById('pause-survey-results-btn');
                        pauseBtn.textContent = data.survey.paused ? 'Fortsetzen' : 'Pausieren';
                        pauseBtn.onclick = async () => {
                            await togglePauseSurvey(surveyId, !data.survey.paused);
                            // We need to refetch the data to get the updated paused status
                            fetchAndRenderResults();
                        };
                    }

                    renderResults(data.survey, data.responses, data.highscore);

                    views.loading.classList.add('hidden');
                    views.results.classList.remove('hidden');
                } catch (error) {
                    console.error("Fehler beim Laden der Ergebnisse (Polling wird fortgesetzt):", error);
                    // Wir zeigen keinen Alert und brechen nicht ab, da es ein temporärer Netzwerkfehler sein könnte
                }
            };

            await fetchAndRenderResults(); // Initialer Aufruf

            // Polling-Intervall: 5 Sekunden (erhöht von 3 zur Schonung des Servers)
            const interval = 5000;
            pollInterval = setInterval(fetchAndRenderResults, interval);
        }

        function renderHighscore(highscore) {
            const container = document.getElementById('highscore-container');

            if (!highscore || highscore.length === 0) {
                container.innerHTML = ''; // Leeren, wenn keine Highscore-Daten vorhanden sind
                return;
            }

            let rowsHTML = '';
            highscore.forEach((entry, index) => {
                const isFinished = entry.currentQuestionIndex >= entry.totalQuestions;
                const progressText = isFinished ? 'Abgeschlossen' : `Frage ${entry.currentQuestionIndex} / ${entry.totalQuestions}`;
                const liveIndicator = !isFinished ? '<span class="highscore-live">● LIVE</span>' : '';
                const rankClass = index < 3 ? `rank-${index + 1}` : '';

                let rankTitle = '';
                if (index === 0) rankTitle = '<span class="rank-title title-1">Legendär</span>';
                else if (index === 1) rankTitle = '<span class="rank-title title-2">Episch</span>';
                else if (index === 2) rankTitle = '<span class="rank-title title-3">Selten</span>';

                rowsHTML += `
                    <tr>
                        <td class="rank"><span class="rank-badge ${rankClass}">${index + 1}</span></td>
                        <td>${entry.nickname} ${rankTitle} ${liveIndicator}</td>
                        <td>${entry.score}</td>
                        <td>${entry.timeTaken}s</td>
                        <td>${progressText}</td>
                    </tr>
                `;
            });

            const existingCard = document.getElementById('highscore-card');

            if (existingCard) {
                // Wenn die Karte bereits existiert (z.B. im Vollbildmodus), nur den Tabelleninhalt aktualisieren
                const tableBody = existingCard.querySelector('#highscore-table tbody');
                tableBody.innerHTML = rowsHTML;
            } else {
                // Andernfalls die gesamte Karte neu erstellen
                let cardHTML = `
                    <div class="card" id="highscore-card">
                        <div class="highscore-header">
                            <h2>Highscore</h2>
                            <button id="fullscreen-btn" class="secondary icon-btn">⛶</button>
                        </div>
                        <table id="highscore-table">
                            <thead>
                                <tr>
                                    <th>Rang</th>
                                    <th>Spitzname</th>
                                    <th>Punkte</th>
                                    <th>Zeit</th>
                                    <th>Fortschritt</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                    </div>
                `;
                container.innerHTML = cardHTML;

                // Event Listener für den Vollbild-Button nur beim ersten Erstellen hinzufügen
                document.getElementById('fullscreen-btn').addEventListener('click', () => {
                    const highscoreCard = document.getElementById('highscore-card');
                    if (!document.fullscreenElement) {
                        highscoreCard.requestFullscreen().catch(err => {
                            alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                        });
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    }
                });
            }
        }

        function renderResults(survey, responses, highscore = null) {
            const container = document.getElementById('results-container');

            // Normalisierung für Robustheit
            let highscoreEnabled = survey.highscoreEnabled;
            if (typeof highscoreEnabled === 'string') {
                highscoreEnabled = highscoreEnabled === 'true' || highscoreEnabled === '1';
            }

            if (highscoreEnabled) {
                renderHighscore(highscore);
            } else {
                document.getElementById('highscore-container').innerHTML = '';
            }

            if (responses.length === 0) {
                container.innerHTML = '<div class="loader">Warte auf erste Antworten...</div>';
                return;
            }

            // Wenn der Container noch den Loader zeigt, leeren wir ihn einmal für den ersten Aufbau
            if (container.querySelector('.loader')) {
                container.innerHTML = '';
            }

            // Prüfen, ob es sich um ein Quiz handelt
            const isQuiz = survey.questions.some(q =>
                q.options && q.options.some(opt => typeof opt === 'object' && opt.correct)
            );

            survey.questions.forEach(q => {
                let card = document.getElementById(`result-card-${q.id}`);
                const isNewCard = !card;

                if (isNewCard) {
                    card = document.createElement('div');
                    card.className = 'card';
                    card.id = `result-card-${q.id}`;
                    card.dataset.type = q.type; // NEU: Typ speichern für PDF-Export
                    if (q.type === 'slider') {
                        card.dataset.min = q.min !== undefined ? q.min : 0;
                        card.dataset.max = q.max !== undefined ? q.max : 10;
                        card.dataset.minLabel = q.minLabel || '';
                        card.dataset.maxLabel = q.maxLabel || '';
                    }
                    card.innerHTML = `<h3>${q.text}</h3><div class="results-content"></div>`;
                    container.appendChild(card);
                }

                const contentDiv = card.querySelector('.results-content');

                if (q.type === 'mc' || q.type === 'mca') {
                    const results = {};
                    q.options.forEach(opt => {
                        const optionText = typeof opt === 'string' ? opt : opt.text;
                        results[optionText] = 0;
                    });

                    let totalVotes = 0;
                    responses.forEach(res => {
                        const answer = res.answers[q.id];
                        if (q.type === 'mca' && Array.isArray(answer)) {
                            answer.forEach(ans => {
                                    if (ans in results) {
                                        results[ans]++;
                                        totalVotes++;
                                    }
                            });
                        } else if (answer in results) {
                            results[answer]++;
                            totalVotes++;
                        }
                    });

                    // Update oder erstelle Balken für jede Option
                    q.options.forEach((opt, index) => {
                        const optionText = typeof opt === 'string' ? opt : opt.text;
                        const isCorrect = isQuiz && (typeof opt === 'object' && opt.correct);
                        const count = results[optionText];
                        const percentage = totalVotes > 0 ? (count / totalVotes * 100).toFixed(1) : 0;
                        const barColorClass = isQuiz ? (isCorrect ? 'result-bar-correct' : 'result-bar-incorrect') : '';

                        let optionWrapper = contentDiv.querySelector(`.option-wrapper-${index}`);
                        if (!optionWrapper) {
                            optionWrapper = document.createElement('div');
                            optionWrapper.className = `option-wrapper-${index}`;
                            contentDiv.appendChild(optionWrapper);
                        }

                        optionWrapper.innerHTML = `
                            <div>
                                <strong>${optionText}</strong> (<span class="vote-count">${count}</span> Stimme${count !== 1 ? 'n' : ''})
                            </div>
                            <div class="result-bar-container">
                                <div class="result-bar ${barColorClass}" style="width: ${percentage}%;">
                                    <span class="percentage-label">${percentage > 5 ? (percentage + '%') : ''}</span>
                                </div>
                            </div>`;
                    });

                } else if (q.type === 'star') {
                    const allRatings = responses
                        .map(res => parseInt(res.answers[q.id]))
                        .filter(val => !isNaN(val));

                    const average = allRatings.length > 0
                        ? (allRatings.reduce((a, b) => a + b, 0) / allRatings.length).toFixed(1)
                        : 0;

                    let starDisplay = '';
                    const fullStars = Math.floor(average);
                    const halfStar = (average - fullStars) >= 0.5;
                    for (let i = 1; i <= 5; i++) {
                        if (i <= fullStars) starDisplay += '★';
                        else if (i === fullStars + 1 && halfStar) starDisplay += '⭐'; // Or just ★ for simplicity in basic unicode
                        else starDisplay += '☆';
                    }

                    contentDiv.innerHTML = `
                        <div class="star-result-container">
                            <span class="average-score">${average}</span>
                            <span class="stars-display">${starDisplay}</span>
                            <span class="vote-count">(${allRatings.length} Stimme${allRatings.length !== 1 ? 'n' : ''})</span>
                        </div>
                    `;

                } else if (q.type === 'slider') {
                    const min = q.min !== undefined ? parseFloat(q.min) : 0;
                    const max = q.max !== undefined ? parseFloat(q.max) : 10;
                    const minLabel = q.minLabel || '';
                    const maxLabel = q.maxLabel || '';

                    const allRatings = responses
                        .map(res => parseFloat(res.answers[q.id]))
                        .filter(val => !isNaN(val));

                    const average = allRatings.length > 0
                        ? (allRatings.reduce((a, b) => a + b, 0) / allRatings.length).toFixed(1)
                        : min.toFixed(1);

                    const percentage = (max - min) > 0 ? ((parseFloat(average) - min) / (max - min)) * 100 : 0;
                    const clampedPercentage = Math.min(Math.max(percentage, 0), 100);

                    contentDiv.innerHTML = `
                        <div class="slider-result-container">
                            <div class="slider-result-stats">
                                <span class="average-score">${average}</span>
                                <span class="vote-count">(${allRatings.length} Stimme${allRatings.length !== 1 ? 'n' : ''})</span>
                            </div>
                            <div class="slider-result-track-wrapper">
                                <div class="slider-result-labels">
                                    <span>${minLabel} (${min})</span>
                                    <span>${maxLabel} (${max})</span>
                                </div>
                                <div class="slider-result-track">
                                    <div class="slider-result-pin" style="left: ${clampedPercentage}%;"></div>
                                </div>
                            </div>
                        </div>
                    `;

                } else if (q.type === 'text') {
                    // Für Textantworten: Neue Antworten hinzufügen, falls vorhanden
                    const currentAnswersCount = contentDiv.querySelectorAll('.text-answer').length;
                    const allTextAnswers = responses
                        .map(res => res.answers[q.id])
                        .filter(ans => ans && ans.trim() !== '');

                    if (allTextAnswers.length > currentAnswersCount) {
                        // Nur die neuen Antworten hinzufügen
                        for (let i = currentAnswersCount; i < allTextAnswers.length; i++) {
                            const answerEl = document.createElement('div');
                            answerEl.className = 'text-answer';
                            answerEl.textContent = allTextAnswers[i];
                            contentDiv.appendChild(answerEl);
                        }
                    } else if (allTextAnswers.length === 0 && currentAnswersCount === 0) {
                        contentDiv.innerHTML = '<p>Noch keine Antworten.</p>';
                    }
                }
            });
        }

        // --- Hilfsfunktionen ---

        function decodeHTML(html) {
            const txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        async function exportResultsAsPDF(title) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 15;
            let yPosition = margin;

            // PDF Styling
            const titleFontSize = 18;
            const questionFontSize = 14;
            const answerFontSize = 11;
            const lineHeight = 7;

            // Titel hinzufügen
            pdf.setFontSize(titleFontSize);
            pdf.setFont("helvetica", "bold");
            const splitTitle = pdf.splitTextToSize(title, pdfWidth - margin * 2);
            pdf.text(splitTitle, margin, yPosition);
            yPosition += (splitTitle.length * lineHeight) + 10;

            // Export von Daten aus dem aktuellen DOM-Stand oder besser: fetchAndRenderResults intern nutzen
            // Aber der einfachste Weg für "lesbar" ist, die DOM-Elemente textuell zu parsen:
            const resultCards = document.querySelectorAll('#results-container .card');

            for (const card of resultCards) {
                const questionText = card.querySelector('h3').innerText;
                const options = card.querySelectorAll('.results-content > div[class^="option-wrapper"]');
                const textAnswers = card.querySelectorAll('.text-answer');

                 // --- Höhe berechnen ---
                let cardHeight = 0;

                // Frage-Höhe
                pdf.setFontSize(questionFontSize);
                const splitQuestion = pdf.splitTextToSize(questionText, pdfWidth - margin * 2);
                cardHeight += (splitQuestion.length * lineHeight) + 3;

                // Antwort-Höhen
                pdf.setFontSize(answerFontSize);
                if (options.length > 0) {
                    options.forEach(opt => {
                        const optionText = opt.querySelector('strong').innerText;
                        const voteText = opt.querySelector('.vote-count').innerText;
                        const text = `- ${optionText} (${voteText} Stimmen)`;
                        const splitText = pdf.splitTextToSize(text, pdfWidth - margin * 2.5);
                        cardHeight += (splitText.length * lineHeight) + 1 + 4 + 5; // Text + Abstand + Balken + Margin
                    });
                } else if (card.dataset.type === 'star') {
                    cardHeight += lineHeight + 5; // Durchschnittstext + Sterne
                } else if (card.dataset.type === 'slider') {
                    cardHeight += lineHeight * 2 + 10; // Durchschnittstext + Slider bar height + spacing
                } else {
                    textAnswers.forEach(ans => {
                        const text = ans.innerText.trim();
                        const splitText = pdf.splitTextToSize("» " + text, pdfWidth - margin * 2.5);
                        cardHeight += (splitText.length * lineHeight) + 2;
                    });
                    if (textAnswers.length === 0) cardHeight += lineHeight;
                }
                cardHeight += 10; // Abstand zum nächsten Block

                // --- Seitenumbruch prüfen ---
                // Wenn die gesamte Karte nicht mehr auf die Seite passt, neue Seite beginnen
                if (yPosition + cardHeight > pageHeight - margin && cardHeight < (pageHeight - margin * 2)) {
                    pdf.addPage();
                    yPosition = margin;
                }

                // --- Karte rendern ---
                // Frage
                pdf.setFontSize(questionFontSize);
                pdf.setFont("helvetica", "bold");
                pdf.text(splitQuestion, margin, yPosition);
                yPosition += (splitQuestion.length * lineHeight) + 3;

                // Antworten
                pdf.setFontSize(answerFontSize);
                pdf.setFont("helvetica", "normal");

                if (options.length > 0) {
                    options.forEach(opt => {
                        const optionText = opt.querySelector('strong').innerText;
                        const voteText = opt.querySelector('.vote-count').innerText;
                        const percentageLabel = opt.querySelector('.percentage-label').innerText;
                        const percentage = parseFloat(percentageLabel) || 0;

                        const text = `- ${optionText} (${voteText} Stimmen)`;
                        const splitText = pdf.splitTextToSize(text, pdfWidth - margin * 2.5);

                        // Fallback: Falls eine einzelne Karte DOCH über eine Seite geht
                        if (yPosition + (splitText.length * lineHeight) > pageHeight - margin) {
                            pdf.addPage();
                            yPosition = margin;
                        }

                        pdf.text(splitText, margin + 5, yPosition);
                        yPosition += (splitText.length * lineHeight) + 1;

                        const barWidth = pdfWidth - margin * 3.5;
                        const barHeight = 4;
                        const barX = margin + 10;

                        pdf.setFillColor(240, 240, 240);
                        pdf.rect(barX, yPosition, barWidth, barHeight, 'F');

                        if (percentage > 0) {
                            pdf.setFillColor(56, 189, 248);
                            pdf.rect(barX, yPosition, (barWidth * percentage) / 100, barHeight, 'F');
                        }

                        yPosition += barHeight + 5;
                    });
                } else if (card.dataset.type === 'star') {
                    const averageScore = parseFloat(card.querySelector('.average-score')?.innerText) || 0;
                    const voteCount = card.querySelector('.vote-count')?.innerText || '(0 Stimmen)';

                    pdf.text(`Durchschnitt: ${averageScore.toFixed(1)}`, margin + 5, yPosition);

                    const starSize = 4;
                    let starX = margin + 45;
                    for (let i = 1; i <= 5; i++) {
                        const fill = i <= Math.round(averageScore) ? 1 : 0;
                        drawPFDStar(pdf, starX, yPosition - starSize + 0.5, starSize, fill);
                        starX += starSize + 1;
                    }

                    pdf.text(voteCount, starX + 2, yPosition);
                    yPosition += lineHeight + 5;

                } else if (card.dataset.type === 'slider') {
                    const averageScore = parseFloat(card.querySelector('.average-score')?.innerText) || 0;
                    const voteCount = card.querySelector('.vote-count')?.innerText || '(0 Stimmen)';
                    const min = parseFloat(card.dataset.min) || 0;
                    const max = parseFloat(card.dataset.max) || 10;
                    const minLabel = card.dataset.minLabel || '';
                    const maxLabel = card.dataset.maxLabel || '';

                    pdf.text(`Durchschnitt: ${averageScore.toFixed(1)} (${minLabel ? minLabel + ' ' : ''}${min} bis ${maxLabel ? maxLabel + ' ' : ''}${max})`, margin + 5, yPosition);
                    yPosition += lineHeight;

                    // Draw visual bar representing slider average in the PDF
                    const barWidth = pdfWidth - margin * 3.5;
                    const barHeight = 3;
                    const barX = margin + 10;

                    // Draw track
                    pdf.setFillColor(240, 240, 240);
                    pdf.rect(barX, yPosition, barWidth, barHeight, 'F');

                    // Draw average pin
                    const percentage = (max - min) > 0 ? (averageScore - min) / (max - min) : 0;
                    const clampedPercentage = Math.min(Math.max(percentage, 0), 100);
                    const pinX = barX + (barWidth * clampedPercentage);
                    
                    pdf.setFillColor(56, 189, 248); // Sky blue
                    pdf.circle(pinX, yPosition + barHeight / 2, 2.5, 'F');

                    pdf.text(voteCount, barX + barWidth + 2, yPosition + 2);
                    yPosition += barHeight + 8;

                } else {
                    textAnswers.forEach(ans => {
                        const text = ans.innerText.trim();
                        const splitText = pdf.splitTextToSize("» " + text, pdfWidth - margin * 2.5);

                        if (yPosition + (splitText.length * lineHeight) > pageHeight - margin) {
                            pdf.addPage();
                            yPosition = margin;
                        }

                        pdf.text(splitText, margin + 5, yPosition);
                        yPosition += (splitText.length * lineHeight) + 2;
                    });
                    if (textAnswers.length === 0) {
                        pdf.text("Keine Antworten.", margin + 5, yPosition);
                        yPosition += lineHeight;
                    }
                }
                yPosition += 10;
            }

            pdf.save(`Umfrage-Ergebnisse-${title.replace(/ /g, "_")}.pdf`);
        }

        // Hilfsfunktion zum Zeichnen eines Sterns im PDF
        function drawPFDStar(pdf, x, y, size, fillPercent = 0) {
            const points = [];
            const outerRadius = size / 2;
            const innerRadius = outerRadius * 0.4;
            const cx = x + outerRadius;
            const cy = y + outerRadius;

            for (let i = 0; i < 10; i++) {
                const angle = (Math.PI / 5) * i - Math.PI / 2;
                const r = i % 2 === 0 ? outerRadius : innerRadius;
                points.push([
                    cx + r * Math.cos(angle),
                    cy + r * Math.sin(angle)
                ]);
            }

            // Stern zeichnen
            pdf.setLineWidth(0.1);
            pdf.setDrawColor(251, 191, 36); // Amber 400

            if (fillPercent >= 1) {
                // Voller Stern
                pdf.setFillColor(251, 191, 36);
                pdf.lines(points.map((p, i) => {
                    const next = points[(i + 1) % 10];
                    return [next[0] - p[0], next[1] - p[1]];
                }), cx + 0 * Math.cos(-Math.PI / 2), cy + outerRadius * Math.sin(-Math.PI / 2), [1, 1], 'F');
            } else {
                // Leerer Stern (Umriss)
                pdf.lines(points.map((p, i) => {
                    const next = points[(i + 1) % 10];
                    return [next[0] - p[0], next[1] - p[1]];
                }), cx + 0 * Math.cos(-Math.PI / 2), cy + outerRadius * Math.sin(-Math.PI / 2), [1, 1], 'D');

                if (fillPercent > 0) {
                    // Optional: Halber Stern (komplizierter zu zeichnen mit lines, daher hier einfach Umriss)
                }
            }
        }

        // --- App starten ---
        document.addEventListener('DOMContentLoaded', handleRouting);
    </script>
